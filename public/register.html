<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card { width: 100%; max-width: 400px; }
        h2 { margin-top: 0; text-align: center; color: var(--primary); }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        #msg { text-align: center; font-size: 0.85rem; margin-top: 1rem; }
        .link-text { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
        .link-text a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Crear Cuenta</h2>
        <form id="register-form">
            <div class="form-group">
                <label for="username">Nuevo Usuario</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-primary">Registrarse</button>
            <p id="msg"></p>
        </form>
        <p class="link-text">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>

    <script>
        const form = document.getElementById('register-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msgEl = document.getElementById('msg');

            try {
                const res = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    msgEl.style.color = 'green';
                    msgEl.textContent = '¡Registro exitoso! Redirigiendo al login...';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    msgEl.style.color = 'var(--danger)';
                    msgEl.textContent = data.error || 'Error al registrar usuario';
                }
            } catch (err) {
                msgEl.style.color = 'var(--danger)';
                msgEl.textContent = 'No se pudo conectar con el servidor.';
            }
        });
    </script>
</body>
</html>
